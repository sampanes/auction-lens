[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "auction-lens"
version = "0.3.0"
description = "Provider-agnostic auction scoring, configurable market valuation, and reporting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.scripts]
auction-lens = "auction_lens.cli:console"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
# Development-only tools; Windows installs tzdata as a runtime dependency above.
dev = ["ruff==0.16.2"]

[tool.ruff]
line-length = 96
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
# E/W  style, F unused names, I import order, B bugs, UP dated idioms,
# C4 clumsy comprehensions, D100 every module says what it is for.
select = ["E", "W", "F", "I", "B", "UP", "C4", "D100"]

[tool.ruff.lint.isort]
known-first-party = ["auction_lens"]
