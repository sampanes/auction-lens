[provider]
id = "nellis"
display_name = "Nellis Auction"
enabled = true

[provider.acquisition]
# See docs/DATA_ACQUISITION.md for everything a fetch requires. A live
# deployment also sets url, timezone, and the request limits here.
mode = "authorized_http"
# Permission to poll is personal and non-transferable. This public example
# cannot grant it: copy the file locally and set this true only after receiving
# authorization for your own use.
authorization_confirmed = false
# Changing a shopping location uses a POST and is not covered merely by
# permission to read public pages. Leave this false unless the provider has
# specifically authorized that branch-scoping request.
session_change_authorized = false
#
# Discovery asks the provider's own search once per term, and one search
# page carries every lot it lists. A live deployment sets:
#   search_url_template = "https://provider.example/search?query={query}"
#   searches = ["soundbar", "monitor"]   # optional; defaults to the
#                                          # any_terms of every interest
#   max_searches_per_run = 8
#   seconds_between_searches = 10
#
# A category sweep finds what a search term cannot: a lot whose title is
# misspelled, or a thing nobody thought to type. A live deployment sets:
#   category_url_template = "https://provider.example/search?query=&Category={category}"
#   categories = ["Electronics", "Home Improvement"]
#   max_categories_per_run = 12
#
# Pacing is measured, not guessed: this provider refuses a burst at around ten
# requests, so ten seconds between them is the floor. See the rate measurement
# in docs/DATA_ACQUISITION.md. Every category raises the request count by one,
# so the cap and the pacing are a single decision.

[economics]
# Listing-level values override this event-dependent fallback.
default_buyer_premium = 0.15
premium_is_taxable = true
sales_tax_rate = 0.0 # Set locally; taxes vary by jurisdiction.
processing_fee = 0.0

[locations]
# allowed is a hard gate. far names the branches that are acceptable but out
# of the way, and a lot there is reported only if it clears far_minimum_score,
# so distance costs a lot something rather than excluding it outright.
#   far = ["phoenix"]
#   far_minimum_score = 85
# An interest match tops out at 90 (80 base, 3 for new, 7 for ending soon), so
# a far_minimum_score of 90 or more hides those branches instead of being
# choosier about them. Leave room under the ceiling.
# Empty means any location. Values are case-insensitive substrings.
allowed = []

[logistics]
# Large items remain eligible, but the report asks about unresolved handling.
# Seller-provided loading assistance removes only the origin-loading question.
large_item_policy = "ask"
manual_handling_limit_lb = 75
large_dimension_threshold_in = 60
# Thresholds only judge lots that publish a weight or a dimension. Many publish
# neither and say it in the title instead, so these phrases count as a stated
# measurement. Matched case-insensitively against the title, branch, and
# conditions. The day a trailer is available, set large_item_policy = "allow"
# and every one of these becomes an ordinary lot again.
oversized_terms = ["truck/trailer pickup only"]

[conditions]
# Reserve global rejection for conditions that are unacceptable for every use.
# Functional defects belong to an individual interest: broken can be useful salvage.
reject = []

[conditions.penalties]
# As with rejection, keep only penalties that apply to every possible purpose.

[condition_profiles.ready_to_use]
allow_unknown = true
reject = ["not functional", "parts only"]

[condition_profiles.ready_to_use.penalties]
"missing parts" = 45
"major damage" = 45
"untested" = 22
"minor damage" = 12
"used" = 4

[condition_profiles.salvage]
allow_unknown = true
reject = []

[scoring]
anomaly_minimum_retail = 100
anomaly_maximum_ratio = 0.20
minimum_report_score = 70
ending_soon_minutes = 20
anomaly_condition_profile = "ready_to_use"

# Inherited by every [[interests]] rule below.
#
# An accessory is sold under the name of whatever it attaches to, so a monitor
# mount says "monitor" as loudly as a monitor does. Every rule needs the same
# sentence, so it is written once rather than copied into each of them.
#
# Put only what is true of every interest here. A rule that explicitly asks for
# one of these words keeps it: an interest in "monitor stand" is not emptied by
# the "stand" below.
[interest_defaults]
# Plain phrases, which mean "accessory" anywhere in a title.
exclude_terms = ["compatible with", "replacement", "adapter", "cable"]
# Words that only mean "accessory" next to the thing itself. "Monitor stand" is
# not a monitor, but a table saw "with rolling stand" is still a table saw, and
# only the distance between the words tells those apart.
accessory_nouns = ["stand", "case", "cover", "mount", "bracket", "holder", "arm",
                   "controller"]

[[interests]]
name = "soundbar"
purpose = "use"
condition_profile = "ready_to_use"
any_terms = ["soundbar", "sound bar"]
max_total_cost = 50
minimum_score = 70

[[interests]]
name = "monitor"
purpose = "use"
condition_profile = "ready_to_use"
any_terms = ["monitor"]
max_total_cost = 80
minimum_score = 70

[valuation]
enabled = true
currency = "USD"

# Sources are data, not code. Add, remove, disable, or reweight them here.
[[valuation.sources]]
id = "reviewed-comps"
label = "Reviewed comparable sales"
adapter = "xml_catalog"
path = "fixtures/synthetic/valuations.xml"
weight = 1.0

[[valuation.sources]]
id = "general-sold-research"
label = "General sold-price research"
adapter = "reference"
url_template = "https://example.invalid/sold-research?q={query}"

[[valuation.sources]]
id = "music-gear-research"
label = "Music gear price guide"
adapter = "reference"
categories = ["guitar", "music gear"]
url_template = "https://example.invalid/music-price-guide?q={query}"

[reports]
# How much of the ranking is worth putting in front of a person. The scoring
# bars decide what is worth reporting at all, and on a good day that is plenty;
# this cuts the tail so the report stays one a reader finishes. Leave it out
# entirely for all of them. Whatever is held back is counted out loud, so a
# short report is never mistaken for a quiet day.
max_items = 30

# How far ahead a closing time is still worth reading about. A lot closing
# tomorrow evening cannot be bid on tonight, and reading about it twice is how
# a digest stops being read. Leave it out entirely to report everything still
# open, however distant.
#
# This is also all there is to a split digest: schedule the run twice, and the
# second one carries only what the first one's lots left behind, because the
# rest have closed. Nothing in the tool knows about schedules.
#   closing_within_hours = 14

# A webhook is the errand email is not: somebody ran the command and wants the
# answer on their phone now. The address is a secret, so only the name of the
# variable holding it appears here.
[reports.webhook]
enabled = false
url_env = "AUCTION_LENS_WEBHOOK_URL"
max_items = 10
username = "Auction Lens"

[reports.email]
enabled = false
# {{ match_count }} and {{ first_close }} are filled in; anything else is left
# as written. Naming the close keeps two digests on the same day from sharing a
# subject, which is what makes a mail client thread them into one another.
subject = "Auction Lens: {{ match_count }} lots, first closes {{ first_close }}"
host_env = "AUCTION_LENS_SMTP_HOST"
port = 465
security = "ssl"
username_env = "AUCTION_LENS_SMTP_USERNAME"
password_env = "AUCTION_LENS_SMTP_PASSWORD"
sender_env = "AUCTION_LENS_EMAIL_FROM"
recipient_env = "AUCTION_LENS_EMAIL_TO"
